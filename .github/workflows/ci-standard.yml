name: CI Standard

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
        shell: bash
      - name: Lint
        run: ruff check src/ tests/
        shell: bash
      - name: Format check
        run: ruff format --check src/ tests/
        shell: bash
      - name: Type check
        run: mypy src/ --ignore-missing-imports
        shell: bash

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install Qt system libraries required by PyQt6 on headless CI
      - name: Install Qt system deps
        shell: bash
        run: |
          # Only run apt-get commands if apt-get is available (i.e. we are on Debian/Ubuntu)
          if command -v apt-get &> /dev/null; then
            sudo killall apt apt-get || true
            sudo rm -f /var/lib/apt/lists/lock
            sudo rm -f /var/cache/apt/archives/lock
            sudo rm -f /var/lib/dpkg/lock*
            sudo dpkg --configure -a || true
            sudo apt-get update -y || true
            sudo apt-get install -y --no-install-recommends libgles2 libegl1 libgl1
          fi
      - run: pip install -e ".[dev]"
        shell: bash
      - name: Run tests
        shell: bash
        run: python3 -m pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

