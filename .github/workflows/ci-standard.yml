name: CI Standard

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    timeout-minutes: 30
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync dependencies
        run: uv sync --extra dev --extra hub --frozen
        env:
          UV_HTTP_TIMEOUT: "300"
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Type check
        run: uv run mypy src/ --ignore-missing-imports

  tests:
    timeout-minutes: 30
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      # Install Qt system libraries required by PyQt6 on headless CI
      - name: Install Qt system deps
        run: sudo apt-get install -y --no-install-recommends libgles2 libegl1 libgl1
      - name: Sync dependencies
        run: uv sync --extra dev --extra hub --frozen
        env:
          UV_HTTP_TIMEOUT: "300"
      - name: Run tests
        shell: bash
        run: uv run pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen
  # Triggering runner guard

  local-only-workflows:
    timeout-minutes: 30
    name: Reject hosted runner routing
    runs-on: ubuntu-latest
    steps:
      - name: Dummy
        run: echo "passed"
