name: CI Standard

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality-gate:
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync dependencies
        run: uv sync --extra dev --frozen
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Type check
        run: uv run mypy src/ --ignore-missing-imports

  tests:
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      # Install Qt system libraries required by PyQt6 on headless CI
      - name: Install Qt system deps
        shell: bash
        run: |
          # Only run apt-get commands if apt-get is available (i.e. we are on Debian/Ubuntu)
          if command -v apt-get &> /dev/null; then
            sudo killall apt apt-get || true
            sudo rm -f /var/lib/apt/lists/lock
            sudo rm -f /var/cache/apt/archives/lock
            sudo rm -f /var/lib/dpkg/lock*
            sudo dpkg --configure -a || true
            sudo apt-get update -y || true
            sudo apt-get install -y --no-install-recommends libgles2 libegl1 libgl1
          fi
      - name: Sync dependencies
        run: uv sync --extra dev --frozen
      - name: Run tests
        shell: bash
        run: uv run pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen
