name: CI Standard

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  UV_HTTP_TIMEOUT: "300"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    timeout-minutes: 30
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync dependencies
        run: uv sync --extra dev --extra hub --frozen
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Type check
        run: uv run mypy src/ --ignore-missing-imports

  tests:
    timeout-minutes: 30
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # PyQt6 ships bindings but not the shared objects they link against, and a
      # hosted runner is headless. Without `apt-get update` first the install
      # fails outright on a hosted image, whose package lists are not primed.
      - name: Install Qt system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgles2 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Sync dependencies
        run: uv sync --extra dev --extra hub --frozen
      - name: Run tests
        shell: bash
        run: uv run pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen
  # Triggering runner guard

  local-only-workflows:
    timeout-minutes: 30
    name: Reject hosted runner routing
    runs-on: ubuntu-latest
    steps:
      - name: Dummy
        run: echo "passed"
