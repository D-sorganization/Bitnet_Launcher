[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitnet-launcher"
version = "0.1.0"
description = "PyQt6 GUI launcher for BitNet LLM models"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6", "fastapi", "pydantic", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt", "pytest-asyncio", "httpx", "ruff>=0.4", "mypy>=1.9", "pre-commit"]
hub = ["huggingface-hub>=0.20"]
all = ["bitnet-launcher[dev,hub]"]

[project.scripts]
bitnet-launcher = "bitnet_launcher.app:main"
bitnet-api = "bitnet_launcher.api:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20", "C90"]
ignore = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"

# Default lane: fast, deterministic, offline.
addopts = """
  -ra
  -q
  --strict-markers
  --strict-config
  --durations=20
  -p no:xvfb
  -m "not slow and not live_simulation and not e2e and not requires_network"
"""

markers = [
  # ---- tier markers ----
  "unit: pure logic, fully mocked, < 100 ms wall-clock",
  "integration: cross-module / file-system / process boundaries, < 5 s",
  "e2e: full-stack smoke tests; nightly + release gate only",
  "slow: > 1 s wall-clock; deselect with -m 'not slow'",
  "live_simulation: requires a real physics / math engine; deselect by default",

  # ---- environment markers ----
  "requires_network: needs real outbound network; deselect by default",
  "requires_gpu: needs CUDA / Metal / ROCm",
  "requires_gl: needs OpenGL or a display",
  "headless_safe: verified under QT_QPA_PLATFORM=offscreen",

  # ---- workflow markers ----
  "serial: must run with -n 0 (xdist parallel breaks this test)",
  "benchmark: deterministic perf smoke; not a primary correctness gate",
  "smoke: release-blocking smoke; subset of e2e",

  # ---- legacy / repo-specific ----
  "asyncio: mark test as async",
]

filterwarnings = [
  # Suppress only third-party noise that's NOT a real correctness signal.
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/bitnet_launcher/gui/*"]

[tool.coverage.report]
# Experimental tier per FLEET_TESTING_STANDARDS.md §6 (non-blocking).
fail_under = 50

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
